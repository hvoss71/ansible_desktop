---
# Einrichtung des Klausurprofils inkl. Nutzer und Prüfungssoftware
- hosts: localhost
  connection: local
  become: true
  vars:
    klausur_user: klausur
    klausur_group: klausur
    klausur_uid: 1010
    klausur_gid: 1010
    klausur_home: /home/klausur
    klausur_pass_hash: ""  # Optional: vorab über Vault/Secret setzen; wenn leer, wird kein Passwort geändert

  tasks:
  - name: Erzeuge eine Gruppe 'klausur'
    ansible.builtin.group:
      name: "{{ klausur_group }}"
      gid: "{{ klausur_gid }}"
      state: present

  - name: Erzeuge einen Nutzer 'klausur' mit eigenem Home-Verzeichnis
    ansible.builtin.user:
      name: "{{ klausur_user }}"
      comment: Klausur
      group: "{{ klausur_group }}"
      state: present
      uid: "{{ klausur_uid }}"
      create_home: yes
      home: "{{ klausur_home }}"
      shell: /bin/bash
      system: no
      # password: "{{ klausur_pass_hash | default(omit) }}"
      # update_password: on_create
  
  - name: Prüfe Passwort-Hash gesetzt und passe ggf. an
    ansible.builtin.shell: |
      if [ -n "{{ klausur_pass_hash | default('') }}" ]; then
        current_hash=$(getent shadow klausur | cut -d: -f2)
        if [ "$current_hash" != "{{ klausur_pass_hash }}" ] && [ -n "$current_hash" ]; then
          usermod -p "{{ klausur_pass_hash }}" klausur
          echo "Password updated for user klausur"
        else
          echo "Password hash already set for user klausur or no change needed"
        fi
      else
        echo "No password hash configured; skipping password change"
      fi
    become: true
    when: klausur_pass_hash is defined
    args:
      executable: /bin/bash
    
    
    
