---
# Einrichtung des Klausurprofils inkl. Nutzer und Prüfungssoftware

- hosts: localhost
  connection: local
  become: true

  tasks:
  - name: Erzeuge eine Gruppe "Klausur"
    ansible.builtin.group:
      name: klausur
      gid: 1010
      state: present

  - name: Erzeuge einen Nutzer 'Klausur' mit einem eigenen Home-Verzeichnis
    ansible.builtin.user:
      name: klausur
      comment: Klausur
      group: klausur
      state: present
      uid: 1010
      create_home: yes
      state: present
#      password: 'klausur'
#      update_password: always 

  - name: Initiale Passwort-Erzeugung für den Nutzer klausur
    shell: usermod -p $(echo 'klausur' | openssl passwd -1 -stdin) 'klausur'

# Das Passwort kann aufgrund neuer Sicherheitsbestimmungen nicht mehr direkt 
# gesetzt werden. Im der hier verwendeten Shell-Anweisung wird das Passwort
# bei jedem Aufruf des Playbooks neu (zurück-)gesetzt.


  - name: Ermittle das aktuelle stabile Next-Exam-Release
    ansible.builtin.uri:
      url: https://api.github.com/repos/Bildungsportal/next-exam/releases/latest
      return_content: yes
      body_format: json
    register: next_exam_release
    
  - name: Ermittle die Download-Adresse des Linux-Student-AppImage
    ansible.builtin.set_fact:
      next_exam_download_url: "{{ item.browser_download_url }}"
    loop: "{{ next_exam_release.json.assets }}"
    when:
      - "'Student' in item.name"
      - "'AppImage' in item.name"
      - "'x86_64' in item.name"

  - name: Lade das aktuelle Next-Exam Student AppImage herunter
    ansible.builtin.get_url:
      url: "{{ next_exam_download_url }}"
      dest: /home/klausur/Next-Exam-Student.AppImage
      owner: klausur
      group: klausur
      mode: '0550'     # - r-x r-x ---
