---
- name: Komplettes Klausur-Setup inkl. Nutzer, Next-Exam AppImage und Gear Lever-Integration
  hosts: localhost
  connection: local
  become: true

  vars:
    klausur_user: klausur
    klausur_group: klausur
    klausur_uid: 1010
    klausur_gid: 1010
    klausur_home: /home/klausur
    klausur_pass_hash: ""  # Optional: vorab über Vault/Secret setzen; wenn leer, wird kein Passwort geändert

    # Next-Exam AppImage
    appimage_path: "{{ klausur_home }}/Next-Exam-Student.AppImage"
    appimage_exec_dir: "{{ klausur_home }}"

    # Gear Lever Desktop-Launcher
    desktop_dir: "{{ klausur_home }}/.local/share/applications"
    desktop_file: "{{ desktop_dir }}/next-exam-appimage.desktop"

    # Autostart Gear Lever
    autostart_dir: "{{ klausur_home }}/.config/autostart"
    gear_lever_autostart: "{{ autostart_dir }}/gear-lever.desktop"

  tasks:
    - name: Erzeuge eine Gruppe 'klausur'
      ansible.builtin.group:
        name: "{{ klausur_group }}"
        gid: "{{ klausur_gid }}"
        state: present

    - name: Erzeuge einen Nutzer 'klausur' mit eigenem Home-Verzeichnis
      ansible.builtin.user:
        name: "{{ klausur_user }}"
        comment: Klausur
        group: "{{ klausur_group }}"
        state: present
        uid: "{{ klausur_uid }}"
        create_home: yes
        home: "{{ klausur_home }}"
        shell: /bin/bash
        system: no
        # password: "{{ klausur_pass_hash | default(omit) }}"
        # update_password: on_create

    - name: Prüfe Passwort-Hash gesetzt und passe ggf. an
      ansible.builtin.shell: |
        if [ -n "{{ klausur_pass_hash | default('') }}" ]; then
          current_hash=$(getent shadow {{ klausur_user }} | cut -d: -f2)
          if [ "$current_hash" != "{{ klausur_pass_hash }}" ] && [ -n "$current_hash" ]; then
            usermod -p "{{ klausur_pass_hash }}" {{ klausur_user }}
            echo "Password updated for user {{ klausur_user }}"
          else
            echo "Password hash already set for user {{ klausur_user }} or no change needed"
          fi
        else
          echo "No password hash configured; skipping password change"
        fi
      become: true
      when: klausur_pass_hash is defined
      args:
        executable: /bin/bash

    - name: Ermittle das aktuelle stabile Next-Exam-Release
      ansible.builtin.uri:
        url: https://api.github.com/repos/Bildungsportal/next-exam/releases/latest
        return_content: yes
        body_format: json
      register: next_exam_release

    - name: Ermittle die Download-Adresse des Linux-Student-AppImage
      ansible.builtin.set_fact:
        next_exam_download_url: "{{ item.browser_download_url }}"
      loop: "{{ next_exam_release.json.assets }}"
      when:
        - "'Student' in item.name"
        - "'AppImage' in item.name"
        - "'x86_64' in item.name"

    - name: Prüfe, ob Download-URL gefunden wurde
      ansible.builtin.fail:
        msg: "Kein passendes Next-Exam AppImage Asset gefunden (Student AppImage, x86_64)."
      when: next_exam_download_url is not defined or next_exam_download_url | trim == ""

    - name: Stelle sicher, dass Home-Verzeichnis von Klausur existiert
      ansible.builtin.file:
        path: "{{ klausur_home }}"
        state: directory
        owner: klausur
        group: klausur
        mode: '0755'

    - name: Lade das aktuelle Next-Exam Student AppImage herunter
      ansible.builtin.get_url:
        url: "{{ next_exam_download_url }}"
        dest: "{{ appimage_path }}"
        owner: klausur
        group: klausur
        mode: '0755'
      when: next_exam_download_url is defined

    - name: Ensure app image is executable
      ansible.builtin.file:
        path: "{{ appimage_path }}"
        mode: '0755'
        owner: klausur
        group: klausur
        state: file

    - name: Ensure applications directory exists
      ansible.builtin.file:
        path: "{{ desktop_dir }}"
        state: directory
        owner: klausur
        group: klausur
        mode: '0755'

    - name: Create desktop launcher for Gear Lever / Next-Exam AppImage
      ansible.builtin.copy:
        dest: "{{ desktop_file }}"
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Next-Exam AppImage
          Exec={{ appimage_path }}
          Icon=application-x-executable
          Terminal=false
          Categories=Education;
        owner: klausur
        group: klausur
        mode: '0644'

    - name: Ensure Gear Lever autostart entry exists
      ansible.builtin.copy:
        dest: "{{ gear_lever_autostart }}"
        content: |
          [Desktop Entry]
          Type=Application
          Name=Gear Lever
          Exec=gear-lever
          X-GNOME-Autostart-enabled=true
        owner: klausur
        group: klausur
        mode: '0644'
      ignore_errors: yes

    - name: Optional: Trigger Gear Lever rescan (if necessary)
      ansible.builtin.shell: |
        gear-lever --reload-cache || true
      args:
        executable: /bin/bash
      ignore_errors: yes
